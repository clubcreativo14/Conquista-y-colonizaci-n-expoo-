<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Viaje al Nuevo Mundo</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff7e6;--ink:#1f2a44;--card:#fff;--c1:#ff6b6b;--c2:#14b8a6;--c3:#ffc93c;--c4:#7c5cff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171b2e;--ink:#fff3dc;--card:#252b45}}
:root[data-theme=dark]{--bg:#171b2e;--ink:#fff3dc;--card:#252b45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Trebuchet MS',system-ui,sans-serif}
header{text-align:center;padding:14px 12px 4px}h1{margin:0;font:800 clamp(24px,4vw,40px) Georgia,serif;background:linear-gradient(90deg,var(--c1),var(--c3),var(--c2),var(--c4));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:2px 0 0;opacity:.75}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;justify-content:center;flex-wrap:wrap}
nav button{border:0;border-radius:99px;padding:8px 14px;font:700 14px inherit;font-family:inherit;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 #0002;transition:.2s}
nav button.on{background:var(--c1);color:#fff;transform:translateY(-2px) scale(1.05)}
main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;max-width:1150px;margin:auto;padding:8px 14px 30px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.mapbox{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 8px 0 var(--c2);align-self:start;background:#bcd9ee}
.mapbox img{display:block;width:100%}.mapbox svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%) scale(0);font-size:22px;transition:.4s;filter:drop-shadow(0 2px 2px #0006)}
.pin.show{transform:translate(-50%,-50%) scale(1);animation:bob 1.6s infinite}
.pin small{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:700 10px sans-serif;background:#fffd;color:#1f2a44;border-radius:6px;padding:0 4px;white-space:nowrap}
@keyframes bob{50%{margin-top:-5px}}
#ship{position:absolute;font-size:34px;left:105%;top:47%;transform:translate(-50%,-50%);transition:left 3.5s ease-in-out,top 3.5s ease-in-out}
.panel{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 8px 0 var(--c4)}
.panel h2{margin:0 0 6px;font:800 24px Georgia,serif}.panel img.hero{width:100%;border-radius:16px;margin:8px 0}
.btn{border:0;border-radius:14px;padding:12px 18px;font:800 16px inherit;font-family:inherit;color:#fff;background:var(--c2);cursor:pointer;box-shadow:0 4px 0 #0004;margin:4px 4px 4px 0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0004}.btn.o{background:var(--c1)}.btn.p{background:var(--c4)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.fc{border-radius:16px;padding:12px;min-height:110px;cursor:pointer;color:#fff;font-weight:700;transition:.3s}
.fc span{display:block;font-size:30px}.fc p{margin:4px 0 0;font-weight:400;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{border:2px solid var(--c4);background:transparent;color:var(--ink);border-radius:99px;padding:6px 12px;font:700 14px inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--c4);color:#fff}
.bar{height:18px;border-radius:99px;background:#0002;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c3),var(--c1));transition:.3s}
.step{display:inline-block;padding:4px 10px;border-radius:99px;background:#0002;margin:3px;font-size:13px;font-weight:700}.step.on{background:var(--c3);color:#1f2a44}
.big{font-size:60px;text-align:center}.fb{min-height:40px;font-weight:700}
</style></head><body>

()=>{const C=[['🔫','Armas y caballos','Armas de fuego, de acero y caballos daban ventaja militar.','#ff6b6b'],['🤝','Alianzas','Aprovecharon conflictos previos y se aliaron con algunos pueblos.','#14b8a6'],['🦠','Enfermedades','Las enfermedades europeas causaron enormes muertes.','#7c5cff'],['✊','Resistencia','Muchos pueblos resistieron y defendieron sus territorios.','#e0a100']];
found=new Set();$('#p').innerHTML=`<h2>Conquistar = controlar el territorio</h2><p>No fue solo por las armas. <b>Tocá cada carta</b> y descubrí qué lo explica 👇</p><div class="grid">${C.map((c,i)=>`<div class="fc" data-i="${i}" style="background:${c[3]}"><span>${c[0]}</span>${c[1]}<p hidden>${c[2]}</p></div>`).join('')}</div><div class="bar"><i id="b"></i></div><p class="fb" id="f">Descubiertas: 0/4</p>`;
document.querySelectorAll('.fc').forEach(e=>e.onclick=()=>{e.querySelector('p').hidden=false;found.add(e.dataset.i);$('#b').style.width=found.size*25+'%';$('#f').textContent=found.size==4?'🎉 ¡La conquista fue una disputa y apropiación del territorio!':`Descubiertas: ${found.size}/4`;if(e.dataset.i==0)pins(['mex'],'⚔️')})},
()=>{const Vs={nes:['mex','Nueva España','Capital: Ciudad de México'],per:['lima','Perú','Capital: Lima'],ng:['car','Nueva Granada','Virreinato de la Corona española'],rp:['ba','Río de la Plata','Creado en 1776. Capital: Buenos Aires']};const seen=new Set();
$('#p').innerHTML=`<h2>👑 Virreinatos: dividir para controlar</h2><p>Después de la conquista, España necesitaba organizar y controlar lo conquistado: creó <b>virreinatos</b>, grandes territorios administrados en nombre de la Corona. Tocá cada uno:</p><div class="chips">${Object.entries(Vs).map(([k,v])=>`<button class="chip" data-k="${k}">${v[1]}</button>`).join('')}</div><p class="fb" id="f"></p>`;
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const v=Vs[b.dataset.k];seen.add(b.dataset.k);b.classList.add('on');pins([v[0]],'👑');$('#f').textContent=v[1]+'. '+v[2]+(seen.size==4?' 🎉 ¡No solo ocuparon el territorio: lo dividieron, administraron y reorganizaron políticamente!':'')})},
()=>{let n=0;const S=['Potosí','Lima / Callao','Panamá','Cartagena','Sevilla'];pins(['pot']);
$('#p').innerHTML=`<h2>⛏️ Potosí: la montaña de plata</h2><p>Oro, plata, tierras y productos agrícolas: el territorio se organizó para <b>extraer y hacer circular recursos</b>, conectando América con Europa y el mundo.</p><button class="btn" id="m">⛏️ ¡Extraer plata!</button><div class="bar"><i id="b"></i></div><div id="s">${S.map(s=>`<span class="step">${s}</span>`).join('')}</div><p class="fb" id="f">Tocá varias veces para mandar la plata en viaje…</p>`;
$('#m').onclick=()=>{n=Math.min(n+1,10);$('#b').style.width=n*10+'%';const k=Math.floor(n/2);document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('on',i<k));
if(k>=1){$('#ship').style.left=(62.5+k*8)+'%';$('#ship').style.top=(70-k*5)+'%'}$('#f').textContent=n>=10?'🚢 ¡La plata llegó a Europa! Caminos y puertos conectaron las redes comerciales.':`💰 Plata extraída: ${n*100} kg`}},
()=>{const L={c:['🏙️ Ciudades',['mex','hab','car','lima','pot','ba'],0],r:['🛣️ Caminos',[],1],p:['⚓ Puertos',['hab','car','ba'],2]};const on=new Set();
$('#p').innerHTML=`<h2>🏙️ Ciudades: nodos de una red</h2><p>Las ciudades eran centros administrativos, comerciales, políticos, religiosos y militares. Conectaban las zonas productoras con caminos y puertos. <b>Activá las capas</b> y armá la red:</p><div class="chips">${Object.entries(L).map(([k,v])=>`<button class="chip" data-k="${k}">${v[0]}</button>`).join('')}</div><p class="fb" id="f">De la mina, por ciudades y rutas, hasta un puerto rumbo a Europa: ¡una red territorial de personas, mercancías y recursos!</p>`;
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k;on.has(k)?on.delete(k):on.add(k);b.classList.toggle('on');
pins([...on].filter(x=>x!='r').flatMap(x=>L[x][1]).filter((v,i,a)=>a.indexOf(v)==i),on.has('c')?'':'⚓');
$('#svg').innerHTML=on.has('r')?`<g stroke="#ff6b6b" stroke-width=".8" stroke-dasharray="2 1.5" fill="none"><path d="M62.5 70.5 L55 68"/><path d="M62.5 70.5 L66 78 L70 84"/><path d="M35 47 L49.5 44"/><path d="M55 68 L53 54"/></g>`:''})},
()=>{const I=[['🐎','Caballo',1],['🌽','Maíz',0],['🐄','Vaca',1],['🐖','Cerdo',1],['🥔','Papa',0],['🌾','Trigo',1],['🍅','Tomate',0]];let i=0,s=0;
$('#p').innerHTML=`<h2>Población y ambiente en transformación</h2><p>Las poblaciones indígenas disminuyeron (enfermedades, guerras, explotación). Llegaron europeos y fueron traídas de manera forzada personas africanas esclavizadas: hubo nuevas relaciones y mestizaje. Se expandieron la agricultura, la ganadería, la minería y la explotación forestal: el paisaje cambió. 🌎</p><div id="q"></div>`;
const r=()=>{if(i>=I.length){$('#q').innerHTML=`<div class="big">🏆</div><p class="fb">¡Puntaje: ${s}/${I.length}! El ambiente y los paisajes también fueron colonizados.</p><button class="btn p" onclick="go(6)">➡️ Siguiente: economía mundial</button>`;return}
$('#q').innerHTML=`<div class="big">${I[i][0]}</div><p style="text-align:center"><b>${I[i][1]}</b>: ¿ya estaba en América o llegó con los europeos?</p><div style="text-align:center"><button class="btn" data-a="0">🌎 Ya estaba</button><button class="btn o" data-a="1">⛵ Llegó con Europa</button></div><p class="fb" id="f"></p>`;
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.a==I[i][2];if(ok)s++;$('#f').textContent=ok?'✅ ¡Correcto!':'❌ Era: '+(I[i][2]?'llegó con los europeos':'ya existía en América');document.querySelectorAll('[data-a]').forEach(x=>x.disabled=1);setTimeout(()=>{i++;r()},1200)})};r()},
()=>{pins(['mex','pot','hab'],'💎');
$('#p').innerHTML=`<h2>🌍 América en la economía mundial</h2><p>América quedó conectada con una economía de escala mundial: las redes comerciales unieron América, Europa, África y Asia. <b>Mandá cargamentos:</b></p><div class="chips"><button class="chip" data-r="1">💎 Metales preciosos</button><button class="chip" data-r="1">🪵 Materias primas</button><button class="chip" data-r="1">🌾 Productos agrícolas</button></div><p class="fb" id="f">¿Qué le mandamos al mundo?</p><p><b>Centro y periferia</b> — tocá las cartas:</p><div class="grid"><div class="fc" style="background:#7c5cff"><span>🏰</span>Centro<p hidden>Concentra el poder y las decisiones económicas.</p></div><div class="fc" style="background:#14b8a6"><span>⛏️</span>Periferia<p hidden>Produce y aporta recursos. ¡Relaciones desiguales entre territorios!</p></div></div><button class="btn p" onclick="go(0)">↺ Volver al inicio</button>`;
document.querySelectorAll('.fc').forEach(e=>e.onclick=()=>e.querySelector('p').hidden=false);
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const s=$('#ship');s.style.transition='none';s.style.left='50%';s.style.top='65%';s.offsetWidth;s.style.transition='left 3.5s ease-in-out,top 3.5s ease-in-out';s.style.left='108%';s.style.top='30%';$('#f').textContent='🚢 '+b.textContent+' rumbo a Europa, África y Asia…'})}];
go(0);
</script></body></html>
